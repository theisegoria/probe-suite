question: Apple's redesigned MetalFX temporal upscaler uses the Neural Engine together with Neural
  Accelerators. On which two Apple silicon chips does Apple say those Neural Accelerators are available?
answer: M5 Pro and M5 Max
accept:
- m5 pro
- m5 max
